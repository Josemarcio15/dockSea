# Análise de Conexões SSH - DockSea
# Data: 2026-09-12
# Escopo: internal/core/connection, internal/core/docker, internal/stacks e integração

[meta]
title = "Relatório de Bugs e Vulnerabilidades nas Conexões SSH"
project = "DockSea"
date = "2026-09-12"
total_issues = 8

# ==============================================================================
# 1. BUGS CRÍTICOS (Risco de Panic, Deadlock e Falha Operacional)
# ==============================================================================

[[bugs]]
id = "SSH-001"
title = "Data Race e Risco de Panic (Nil Pointer Dereference) em Client"
severity = "CRITICAL"
category = "Concurrency / Stability"
files = [
    "internal/core/connection/client.go",
    "internal/core/connection/command.go"
]
description = """
No arquivo client.go, o método IsAlive() lê e escreve c.lastPing = time.Now() concorrentemente \
sem nenhuma sincronização por mutex, causando data race detectável em profiling.
Mais crítico ainda, o método ForceClose() atribui c.sshClient = nil sem nenhuma sincronização atômica \
ou lock compartilhado. Se outra goroutine estiver no mesmo instante invocando ExecCommand, \
GetStreamHttpClient, StartCommandOutput ou IsAlive, a desreferência de c.sshClient causa \
panic: runtime error: invalid memory address or nil pointer dereference, derrubando a aplicação inteira.
"""
impact = "Crash fatal da aplicação (panic em tempo de execução) e condições de corrida concorrente."
recommendation = """
Proteger o acesso a c.sshClient e c.lastPing usando sync.RWMutex dentro de Client, \
ou usar atomic.Pointer para sshClient, garantindo que o fechamento espere chamadas ativas ou trate nil com segurança.
"""

[[bugs]]
id = "SSH-002"
title = "Deadlock e Congelamento Global de Conexões no Pool (Manager)"
severity = "CRITICAL"
category = "Concurrency / Deadlock"
files = [
    "internal/core/connection/manager.go"
]
description = """
No arquivo manager.go, o método GetClient(server) retém o lock global m.mu.Lock() e, com esse \
lock adquirido, chama client.IsAlive().
O método IsAlive() realiza I/O de rede via SSH (sshClient.SendRequest('keepalive@openssh.com', true, nil)).
Se a VPS remota demorar para responder, sofrer queda de rede ou pacote retido, o mutex global fica preso. \
Durante esse tempo, nenhuma outra operação no app (mesmo para outros servidores ou conexões Docker locais) \
consegue obter cliente ou fechar conexões, congelando o backend por completo.
"""
impact = "Bloqueio e congelamento total da aplicação quando uma VPS apresentar lentidão ou queda de rede."
recommendation = """
Liberar o lock global m.mu antes de executar verificações de rede (I/O bloqueante) em IsAlive(), \
utilizando verificações otimistas ou locks por ID de servidor.
"""

[[bugs]]
id = "SSH-003"
title = "Vazamento de Processos Remotos e Descarte de Contexto (Context Ignored)"
severity = "CRITICAL"
category = "Resource Leak / Process Lifecycle"
files = [
    "internal/core/connection/command.go"
]
description = """
Os métodos StartCommandOutput e StartCommandInput recebem o parâmetro ctx context.Context, mas \
ignoram-no totalmente na execução SSH (ao contrário da execução local que usa exec.CommandContext).
A sessão é iniciada via session.Start(finalCmd) e nenhuma goroutine monitora ctx.Done().
Se o usuário cancelar um deploy longo, se ocorrer timeout ou a aba for fechada, o comando remoto \
(ex: docker compose up --build ou descompactação tar) continuará rodando infinitamente na VPS, \
deixando locks e processos órfãos. Além disso, os pipes de streaming podem travar goroutines locais.
"""
impact = "Processos zumbis no servidor remoto, consumo desnecessário de CPU/disco e impossibilidade de cancelar operações."
recommendation = """
Criar uma goroutine em StartCommandOutput/StartCommandInput que escuta ctx.Done() e chama \
session.Signal(ssh.SIGKILL) / session.Close() para interromper a execução remota imediatamente.
"""

# ==============================================================================
# 2. FALHAS GRAVES DE LÓGICA E SEGURANÇA (Severidade Alta)
# ==============================================================================

[[bugs]]
id = "SSH-004"
title = "Invalidação Incompleta de Cache ao Atualizar Senha do Sudo"
severity = "HIGH"
category = "State Inconsistency / Auth"
files = [
    "internal/core/connection/manager.go"
]
description = """
No método GetClient do manager.go, a comparação que decide se a conexão em cache ainda é válida \
checa Host, Port, Username, SshPassword, SshKeyPath, DockerSocketPath, SshKeyPassphrase e ConnectionType, \
mas NÃO verifica client.server.SudoPassword == server.SudoPassword.
Se o usuário alterar a senha do Sudo na interface após uma falha ou troca de credenciais, o Manager \
reutiliza a conexão antiga com a senha de Sudo desatualizada. Com isso, qualquer comando subsequente \
com privilégios elevados continuará falhando até que o app seja reiniciado.
"""
impact = "Impossibilidade de executar comandos privilegiados após alteração da senha do Sudo sem reiniciar o app."
recommendation = """
Adicionar client.server.SudoPassword == server.SudoPassword na condição de reuso e atualizar \
o client.server armazenado.
"""

[[bugs]]
id = "SSH-005"
title = "Exposição de Senha Sudo em Linha de Comando na Tabela de Processos"
severity = "HIGH"
category = "Security / Credential Exposure"
files = [
    "internal/core/connection/command.go"
]
description = """
Em buildFinalCmd, quando useSudo é verdadeiro e há SudoPassword, o comando é montado como:
echo 'SENHA' | sudo -S -p '' bash -c 'CMD'
Ao enviar esse comando para o SSH, a senha em texto plano é repassada como argumento do shell e \
fica visível na tabela de processos remotos (/proc/<pid>/cmdline, ps aux, logs de auditoria e monitoramentos da VPS), \
permitindo que outros processos locais ou usuários leiam a credencial de root/sudo.
"""
impact = "Vazamento de credencial de superusuário na VPS remota para outros usuários ou logs de auditoria."
recommendation = """
Injetar a senha do sudo através do stdin da sessão SSH diretamente via session.StdinPipe() \
em vez de concatená-la na string de comando com echo.
"""

# ==============================================================================
# 3. INCOMPATIBILIDADES E FALHAS DE RESILIÊNCIA (Severidade Média)
# ==============================================================================

[[bugs]]
id = "SSH-006"
title = "Incompatibilidade de Formatação de Endereços IPv6"
severity = "MEDIUM"
category = "Networking / Compatibility"
files = [
    "internal/core/connection/ssh.go",
    "internal/core/docker/diagnostic.go"
]
description = """
Em ssh.go e diagnostic.go, o endereço de destino é concatenado com:
fmt.Sprintf("%s:%d", strings.TrimSpace(server.Host), port)
Se o host informado for um endereço IPv6 (ex: 2001:db8::1), a string gerada fica 2001:db8::1:22, \
o que causa falha de parsing e erro de conexão no net.Dial e ssh.Dial.
"""
impact = "Impossibilidade de conectar a servidores VPS configurados com endereços IPv6 diretos."
recommendation = """
Substituir a formatação por net.JoinHostPort(strings.TrimSpace(server.Host), strconv.Itoa(port)).
"""

[[bugs]]
id = "SSH-007"
title = "Validação Incondicional de Chave de Host (InsecureIgnoreHostKey)"
severity = "MEDIUM"
category = "Security / Man-in-the-Middle"
files = [
    "internal/core/connection/ssh.go"
]
description = """
A configuração ssh.ClientConfig define:
HostKeyCallback: ssh.InsecureIgnoreHostKey()
Isso desativa qualquer verificação da identidade do servidor remoto, aceitando cegamente qualquer chave. \
Em redes públicas ou em casos de envenenamento de DNS/ARP, permite ataques de Man-in-the-Middle (MitM).
"""
impact = "Vulnerabilidade a interceptação ou falsificação de conexão (MitM) em redes inseguras."
recommendation = """
Implementar armazenamento ou verificação de fingerprint de chaves conhecidas (known_hosts / TOFU - Trust On First Use), \
ou permitir ao usuário confirmar e salvar o fingerprint da VPS.
"""

[[bugs]]
id = "SSH-008"
title = "ExecCommand sem Timeout ou Cancelamento de Sessão"
severity = "MEDIUM"
category = "Resilience / Hang"
files = [
    "internal/core/connection/command.go"
]
description = """
O método ExecCommand(cmd string, useSudo bool) não aceita contexto e não possui timeout interno. \
A chamada session.CombinedOutput(finalCmd) aguarda indefinidamente a finalização do comando. \
Se o comando remoto entrar em loop infinito, travar esperando entrada de terminal ou sofrer bloqueio de disco, \
a goroutine chamadora ficará bloqueada para sempre.
"""
impact = "Requisições congeladas indefinidamente em caso de comandos remotos travados."
recommendation = """
Refatorar ExecCommand para suportar context.Context ou definir um timeout padrão seguro por comando.
"""
